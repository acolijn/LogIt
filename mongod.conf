# MongoDB configuration for LogIt
# Usage: mongod --config /path/to/mongod.conf

storage:
  dbPath: /home/ubuntu/mongodb_data

net:
  port: 27017
  # Listen on all interfaces - use firewall to restrict access
  bindIp: 0.0.0.0

security:
  authorization: enabled

# Logging (disabled - use console output)
# systemLog:
#   destination: file
#   path: /home/ubuntu/LogIt/mongodb_data/mongod.log
#   logAppend: true
