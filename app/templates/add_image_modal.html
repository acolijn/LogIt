<!-- Bootstrap 5 Modal for Initial Image Upload -->
<div class="modal fade" id="imageUploadModal" tabindex="-1" aria-labelledby="imageUploadModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="imageUploadModalLabel">Upload Images</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <input type="file" class="form-control" id="modalFileInput" name="image" multiple>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="selectImagesButton" data-bs-dismiss="modal">Select</button>
                    </div>
                </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        $('#selectImagesButton').on('click', function () {
            // Copy files from modal's input to main form's input
            const files = $('#modalFileInput').prop('files');
            $('#mainFileInput').prop('files', files);

            // Extract the names of the selected files
            var filenames = [];
            for (var i = 0; i < files.length; i++) {
                filenames.push(files[i].name);
            }

            // Display the file names in the #selectedFilesList div
            $('#selectedFilesList').text(filenames.join(', '));

            // Close the modal
            $('#imageUploadModal').modal('hide');
        });
    });

</script>

<!-- Bootstrap 5 Modal for additional Image Upload -->


<div class="modal fade" id="imageAdditionModal" tabindex="-1" aria-labelledby="imageAdditionModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="imageAdditionModalLabel">Add More Images</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="POST" enctype="multipart/form-data" action="/add_images" id="imageAdditionForm">
                    <!-- Drag and Drop Zone -->
                    <div id="dropZone" class="border rounded p-4 text-center mb-3" style="border: 2px dashed #ccc; background-color: #f8f9fa; cursor: pointer; min-height: 150px;" tabindex="0">
                        <div id="dropZoneContent">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-cloud-upload mb-2" viewBox="0 0 16 16" style="color: #6c757d;">
                                <path fill-rule="evenodd" d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
                                <path fill-rule="evenodd" d="M7.646 4.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V14.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3z"/>
                            </svg>
                            <p class="mb-2"><strong>Drag and drop files here</strong></p>
                            <p class="text-muted small mb-2">or click to browse</p>
                            <p class="text-muted small mb-0"><em>You can also paste screenshots</em></p>
                        </div>
                        <div id="filePreview" style="display: none;"></div>
                    </div>
                    
                    <!-- File Input (hidden) -->
                    <div class="mb-3">
                        <input type="file" class="form-control" name="newImage" id="newImageInput" multiple style="display: none;">
                    </div>
                    
                    <input type="hidden" name="entry_id">
                    <!-- to identify which entry to update -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <input type="submit" class="btn btn-primary" value="Upload" id="uploadButton">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    let droppedFiles = null; // Store dropped files globally
    
    $('#imageAdditionModal').on('show.bs.modal', function (event) {
        const button = $(event.relatedTarget); // Button that triggered the modal
        const entryId = button.data('entry-id'); // Extract the entry_id from the data-entry-id attribute
        const modal = $(this);
        modal.find('input[name="entry_id"]').val(entryId);
        
        // Clear previous file selection
        $('#newImageInput').val('');
        $('#dropZoneContent').show();
        $('#filePreview').hide().empty();
        droppedFiles = null;
    });
    
    // Drag and Drop functionality
    $(document).ready(function() {
        const dropZone = $('#dropZone');
        const dropZoneContent = $('#dropZoneContent');
        const filePreview = $('#filePreview');
        const fileInput = $('#newImageInput');
        const form = $('#imageAdditionForm');
        let pastedFiles = []; // Store pasted files
        
        // Click to browse
        dropZone.on('click', function(e) {
            // Don't trigger if clicking on the preview area
            if (!$(e.target).closest('#filePreview').length) {
                fileInput.click();
            }
        });
        
        // Handle file input change (from browse)
        fileInput.on('change', function() {
            droppedFiles = null; // Clear dropped files when using file picker
            pastedFiles = []; // Clear pasted files
            handleFiles(this.files);
        });
        
        // Handle paste events (for screenshots)
        $(document).on('paste', function(e) {
            // Only handle paste when modal is open
            if (!$('#imageAdditionModal').hasClass('show')) {
                return;
            }
            
            const clipboardData = e.originalEvent.clipboardData || window.clipboardData;
            const items = clipboardData.items;
            
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const blob = items[i].getAsFile();
                    const timestamp = new Date().getTime();
                    const file = new File([blob], 'pasted-image-' + timestamp + '.png', { type: 'image/png' });
                    
                    // Add to pasted files array
                    pastedFiles.push(file);
                    
                    // Create DataTransfer to combine all files
                    const dataTransfer = new DataTransfer();
                    
                    // Add existing files from input
                    const existingFiles = fileInput[0].files;
                    for (let j = 0; j < existingFiles.length; j++) {
                        dataTransfer.items.add(existingFiles[j]);
                    }
                    
                    // Add newly pasted file
                    dataTransfer.items.add(file);
                    
                    // Update input
                    fileInput[0].files = dataTransfer.files;
                    handleFiles(dataTransfer.files);
                    break;
                }
            }
        });
        
        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.on(eventName, function(e) {
                e.preventDefault();
                e.stopPropagation();
            });
        });
        
        // Highlight drop zone when dragging over it
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.on(eventName, function() {
                $(this).css({
                    'background-color': '#d1e7dd',
                    'border-color': '#198754',
                    'border-width': '3px'
                });
            });
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.on(eventName, function() {
                $(this).css({
                    'background-color': '#f8f9fa',
                    'border-color': '#ccc',
                    'border-width': '2px'
                });
            });
        });
        
        // Handle dropped files
        dropZone.on('drop', function(e) {
            const dt = e.originalEvent.dataTransfer;
            const files = dt.files;
            
            // Store dropped files
            droppedFiles = files;
            
            // Transfer files to input using DataTransfer
            const dataTransfer = new DataTransfer();
            for (let i = 0; i < files.length; i++) {
                dataTransfer.items.add(files[i]);
            }
            fileInput[0].files = dataTransfer.files;
            
            handleFiles(files);
        });
        
        function handleFiles(files) {
            if (files.length > 0) {
                // Hide the initial content
                dropZoneContent.hide();
                
                // Update drop zone styling
                dropZone.css({
                    'background-color': '#d1e7dd',
                    'border-color': '#198754',
                    'border-style': 'solid'
                });
                
                // Show file preview
                filePreview.empty();
                
                const successIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-check-circle-fill mb-2" viewBox="0 0 16 16" style="color: #198754;"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/></svg>';
                
                filePreview.append(successIcon);
                filePreview.append('<p class="mb-2 text-success"><strong>' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' selected</strong></p>');
                
                const fileList = $('<div class="text-start" style="max-height: 100px; overflow-y: auto;"></div>');
                for (let i = 0; i < files.length; i++) {
                    const fileSize = (files[i].size / 1024).toFixed(1) + ' KB';
                    const fileName = $('<div class="small text-muted"></div>').text('• ' + files[i].name + ' (' + fileSize + ')');
                    fileList.append(fileName);
                }
                filePreview.append(fileList);
                
                filePreview.show();
            }
        }
    });
</script>
