server {
    listen 443 ssl;
    server_name logit-xams.nikhef.nl;

    ssl_certificate /etc/letsencrypt/live/logit-xams/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logit-xams/privkey.pem;

    location / {
        proxy_pass http://unix:/home/ubuntu/LogIt/logit.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ubuntu/LogIt/app/static/;
    }
}
